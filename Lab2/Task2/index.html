<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Instagram</title>
    <link rel = "stylesheet" href = "style.css">
</head>
<body>
<div class = "container">
<div class = "left">
    <img src="https://static.vecteezy.com/system/resources/thumbnails/038/447/961/small/ai-generated-instagram-logo-free-png.png" id = "logo">
    <p>
      See everyday moments from your <span id = "cl">close friends</span>.
    </p>
  <img src="https://static.cdninstagram.com/rsrc.php/yN/r/-erGonz07kB.webp" id = "photo">

</div>
<div class = "right">
    <div class = "r1">
  <p>Log in to Instagram</p>
  <form action = "https://www.instagram.com/accounts/password/change/" method = "post">
    <input type = "text" name = "email" placeholder = "Mobile number, username or email address"><br>
    <input type = "password" name = "password" placeholder = "Password">
      <input type="submit" value = "Log in" id = "login">
  </form>
    <button type = "submit" name = "Forgot password" id = "fp">Forgot password?</button>
    <button type = "submit" id = "facebook" value = "Facebook"><img src="https://upload.wikimedia.org/wikipedia/commons/b/b8/2021_Facebook_icon.svg" alt="fb" style="width: 14px;">Log in with Facebook</button>
    <button type = "submit" id = "newaccount" value = "New account">Create new account</button>
</div>
</div>
</div>
</body>
</html>
